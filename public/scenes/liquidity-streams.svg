<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <rect width="1200" height="800" fill="#07111F"/>
  <!-- Liquidity source streams -->
  <g stroke-linecap="round" fill="none">
    <path d="M50 100 C200 150 350 120 500 180 C650 240 800 200 950 260 C1050 300 1150 280 1200 300" stroke="#725CFF" stroke-width="2" stroke-opacity="0.5"/>
    <path d="M50 200 C250 250 400 220 550 280 C700 340 850 300 1000 360 C1080 390 1150 370 1200 380" stroke="#20D8E8" stroke-width="2" stroke-opacity="0.4"/>
    <path d="M50 300 C300 350 450 320 600 380 C750 440 900 400 1050 460 C1100 480 1150 470 1200 470" stroke="#64F2C1" stroke-width="1.5" stroke-opacity="0.3"/>
  </g>
  <!-- Aggregation node -->
  <rect x="480" y="340" width="240" height="80" rx="12" fill="#0D1B2E" stroke="#20D8E8" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="600" y="375" text-anchor="middle" fill="#F5F8FC" font-family="sans-serif" font-size="15" font-weight="600">Aggregation</text>
  <text x="600" y="400" text-anchor="middle" fill="#7C8DA3" font-family="monospace" font-size="11">Pricing · Routing</text>
  <!-- Execution outputs -->
  <g font-family="sans-serif" font-size="13" font-weight="500">
    <rect x="200" y="550" width="140" height="45" rx="8" fill="#0D1B2E" stroke="#20D8E8" stroke-opacity="0.3"/>
    <text x="270" y="578" text-anchor="middle" fill="#F5F8FC">MT4</text>
    <rect x="400" y="550" width="140" height="45" rx="8" fill="#0D1B2E" stroke="#20D8E8" stroke-opacity="0.3"/>
    <text x="470" y="578" text-anchor="middle" fill="#F5F8FC">MT5</text>
    <rect x="600" y="550" width="140" height="45" rx="8" fill="#0D1B2E" stroke="#725CFF" stroke-opacity="0.3"/>
    <text x="670" y="578" text-anchor="middle" fill="#F5F8FC">MT7</text>
    <rect x="800" y="550" width="140" height="45" rx="8" fill="#0D1B2E" stroke="#725CFF" stroke-opacity="0.3"/>
    <text x="870" y="578" text-anchor="middle" fill="#F5F8FC">cTrader</text>
