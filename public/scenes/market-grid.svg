<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="grid-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20D8E8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#20D8E8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#20D8E8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#20D8E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#725CFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#725CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="#07111F"/>
  <!-- Market grid -->
  <g stroke="#20D8E8" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 100h1200M0 200h1200M0 300h1200M0 400h1200M0 500h1200M0 600h1200M0 700h1200"/>
    <path d="M100 0v800M200 0v800M300 0v800M400 0v800M500 0v800M600 0v800M700 0v800M800 0v800M900 0v800M1000 0v800M1100 0v800"/>
  </g>
  <!-- Data trails -->
  <path d="M0 600 Q200 550 400 580 T800 520 T1200 560" stroke="#20D8E8" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>
  <path d="M0 650 Q300 600 600 630 T1200 610" stroke="#725CFF" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round"/>
  <path d="M0 550 Q250 500 500 530 T1000 490" stroke="#64F2C1" stroke-width="1" stroke-opacity="0.25" stroke-linecap="round"/>
  <!-- Glow fields -->
  <circle cx="300" cy="300" r="200" fill="url(#glow-cyan)"/>
  <circle cx="900" cy="500" r="250" fill="url(#glow-violet)"/>
  <!-- Data nodes -->
  <g fill="#20D8E8">
    <circle cx="200" cy="400" r="3" opacity="0.8"/>
    <circle cx="400" cy="350" r="2" opacity="0.6"/>
    <circle cx="600" cy="450" r="3" opacity="0.7"/>
    <circle cx="800" cy="380" r="2" opacity="0.5"/>
    <circle cx="1000" cy="420" r="3" opacity="0.8"/>
  </g>
  <g fill="#725CFF">
    <circle cx="300" cy="500" r="2" opacity="0.6"/>
    <circle cx="500" cy="420" r="3" opacity="0.7"/>
    <circle cx="700" cy="480" r="2" opacity="0.5"/>
    <circle cx="900" cy="350" r="3" opacity="0.6"/>
  </g>
</svg>
