<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <rect width="1200" height="800" fill="#07111F"/>
  <g stroke="#20D8E8" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 200h1200M0 400h1200M0 600h1200"/>
    <path d="M200 0v800M400 0v800M600 0v800M800 0v800M1000 0v800"/>
  </g>
  <!-- Connection lines from center console to nodes -->
  <g stroke="#20D8E8" stroke-width="1" stroke-opacity="0.3">
    <path d="M600 400 L300 200"/>
    <path d="M600 400 L900 200"/>
    <path d="M600 400 L200 500"/>
    <path d="M600 400 L1000 500"/>
    <path d="M600 400 L400 650"/>
    <path d="M600 400 L800 650"/>
  </g>
  <!-- Center console -->
  <rect x="480" y="320" width="240" height="160" rx="12" fill="#0D1B2E" stroke="#20D8E8" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="600" y="390" text-anchor="middle" fill="#F5F8FC" font-family="sans-serif" font-size="18" font-weight="600">FOREXAA</text>
  <text x="600" y="420" text-anchor="middle" fill="#7C8DA3" font-family="monospace" font-size="11">Operating Console</text>
  <!-- Satellite nodes -->
  <g font-family="sans-serif" font-size="13" font-weight="500">
    <rect x="220" y="160" width="160" height="50" rx="8" fill="#0D1B2E" stroke="#20D8E8" stroke-opacity="0.3"/>
    <text x="300" y="190" text-anchor="middle" fill="#F5F8FC">CRM</text>
    <rect x="820" y="160" width="160" height="50" rx="8" fill="#0D1B2E" stroke="#725CFF" stroke-opacity="0.3"/>
    <text x="900" y="190" text-anchor="middle" fill="#F5F8FC">Trading</text>
    <rect x="120" y="470" width="160" height="50" rx="8" fill="#0D1B2E" stroke="#64F2C1" stroke-opacity="0.3"/>
    <text x="200" y="500" text-anchor="middle" fill="#F5F8FC">Liquidity</text>
    <rect x="920" y="470" width="160" height="50" rx="8" fill="#0D1B2E" stroke="#725CFF" stroke-opacity="0.3"/>
    <text x="1000" y="500" text-anchor="middle" fill="#F5F8FC">Payments</text>
    <rect x="320" y="620" width="160" height="50" rx="8" fill="#0D1B2E" stroke="#64F2C1" stroke-opacity="0.3"/>
    <text x="400" y="650" text-anchor="middle" fill="#F5F8FC">Risk</text>
    <rect x="720" y="620" width="160" height="50" rx="8" fill="#0D1B2E" stroke="#20D8E8" stroke-opacity="0.3"/>
    <text x="800" y="650" text-anchor="middle" fill="#F5F8FC">Partners</text>
