name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secrets-dependent jobs in Phase 1/2 (Rule 39 / 76).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Security header verification
        run: npm run verify:headers

      - name: SEO check (headers, metadata, sitemap, links, claims)
        run: npm run seo:check
